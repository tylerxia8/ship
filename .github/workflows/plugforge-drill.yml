name: PlugForge Drill

on:
  pull_request:
  push:
    branches:
      - plugforge/main

jobs:
  ttfe:
    name: Time to First Event
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: Run TTFE drill
        env:
          TTFE_TARGET_MS: "60000"
        run: |
          mkdir -p test-results
          corepack pnpm drill ttfe | tee test-results/ttfe.log

      - name: Run flake drill
        env:
          PLUGFORGE_FLAKE_RUNS: "20"
          PLUGFORGE_FLAKE_OUTPUT: test-results/plugforge-flake-proof.json
        run: corepack pnpm plugforge:flake

      - name: Upload PlugForge proof artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: plugforge-drill-proof
          path: |
            test-results/ttfe.log
            test-results/plugforge-flake-proof.json
          if-no-files-found: warn
